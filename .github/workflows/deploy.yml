name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://t.me/ByteTisbi_bot
    env:
      ALTARE_HOST: ${{ secrets.ALTARE_HOST }}
      ALTARE_PORT: ${{ secrets.ALTARE_PORT }}
      ALTARE_USER: ${{ secrets.ALTARE_USER }}
      ALTARE_SSH_KEY: ${{ secrets.ALTARE_SSH_KEY }}
    steps:
      - name: Preflight
        id: preflight
        run: |
          missing=""
          if [ -z "$ALTARE_HOST" ]; then missing="$missing ALTARE_HOST"; fi
          if [ -z "$ALTARE_SSH_KEY" ]; then missing="$missing ALTARE_SSH_KEY"; fi
          if [ -n "$missing" ]; then
            echo "::notice::deploy skipped: missing secrets:$missing (see docs/RUN.md §CI/CD)"
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
          echo "port=${ALTARE_PORT:-22}" >> "$GITHUB_OUTPUT"
          echo "user=${ALTARE_USER:-root}" >> "$GITHUB_OUTPUT"

      - name: Install SSH key
        if: steps.preflight.outputs.ok == '1'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ALTARE_SSH_KEY" > ~/.ssh/altare
          chmod 600 ~/.ssh/altare
          for i in 1 2 3; do
            if ssh-keyscan -p "${{ steps.preflight.outputs.port }}" -H "$ALTARE_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            echo "keyscan attempt $i failed, retrying"
            sleep 3
          done

      - name: Deploy over SSH (retry 3)
        if: steps.preflight.outputs.ok == '1'
        run: |
          for attempt in 1 2 3; do
            echo "deploy attempt $attempt/3"
            if ssh -i ~/.ssh/altare \
                -p "${{ steps.preflight.outputs.port }}" \
                -o BatchMode=yes -o ConnectTimeout=15 \
                -o StrictHostKeyChecking=accept-new \
                "${{ steps.preflight.outputs.user }}@$ALTARE_HOST" \
                'bash -s' <<'REMOTE'
          set -eu
          export PATH=/root/.local/bin:/usr/local/bin:/usr/bin:/bin:$PATH
          cd /opt/bytebot
          before=$(git rev-parse HEAD)
          git pull --ff-only
          changed=$(git diff --name-only "$before" HEAD)
          docs_only=0
          if [ -n "$changed" ]; then
            docs_only=1
            while IFS= read -r path; do
              case "$path" in
                docs/*|tests/*|*.md|.superpowers/*) ;;
                *) docs_only=0; break ;;
              esac
            done <<< "$changed"
          fi
          if [ "$docs_only" = 1 ]; then
            echo "docs/tests-only diff: prod restart skipped"
            exit 0
          fi
          if ! git diff --quiet "$before" HEAD -- uv.lock; then
            echo "uv.lock changed, syncing"
            /root/.local/bin/uv sync --frozen --no-dev
          fi
          set -a; . /opt/bytebot/.env; set +a
          /root/.local/bin/uv run alembic upgrade head
          /usr/bin/supervisorctl restart bytebot-bot bytebot-worker
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null localhost:8080/healthz \
               && curl -fsS -o /dev/null localhost:8080/readyz; then
              echo "health: ok"; exit 0
            fi
            sleep 2
          done
          echo "health check failed after 60s" >&2
          tail -n 50 /var/log/bytebot-bot.log >&2 || true
          exit 1
          REMOTE
            then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "deploy attempt $attempt failed (transient SSH banner timeout?), retrying in 12s" >&2
              sleep 12
            fi
          done
          echo "deploy failed after 3 attempts" >&2
          exit 1

      # Workflow environments create the deployment entry; a status is the only
      # place the API accepts a human description and environment URL.
      - name: Annotate deployment
        if: always() && steps.preflight.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ job.status }}" in
            success) state=success ;;
            cancelled) state=inactive ;;
            *) state=failure ;;
          esac
          id=$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$GITHUB_SHA&environment=production" \
            --jq '.[0].id // empty' 2>/dev/null || true)
          if [ -z "$id" ]; then
            echo "::warning::no production deployment entry for $GITHUB_SHA"
            exit 0
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" \
            -f state="$state" \
            -f description="Byte Guardian on Altare — @ByteTisbi_bot" \
            -f environment_url="https://t.me/ByteTisbi_bot" >/dev/null